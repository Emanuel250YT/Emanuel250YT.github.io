version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Never adopt versions published less than 7 days ago (supply-chain attacks).
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check 0.9 only supports TypeScript ^5 || ^6 (peerDependencies).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
