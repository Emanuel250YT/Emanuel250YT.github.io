# Build + verificacion en cada PR; deploy a GitHub Pages en cada push a main.
# Las acciones estan fijadas por SHA (supply chain); Dependabot las actualiza.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build y verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc fija ignore-scripts=true: ninguna dependencia ejecuta scripts de instalacion.
      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Verificar firmas del registro
        run: npm audit signatures

      - name: Auditar vulnerabilidades
        run: npm audit --omit=dev --audit-level=moderate

      - name: Tipos (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: SEO y accesibilidad estaticos
        run: node scripts/verify-seo.mjs

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
