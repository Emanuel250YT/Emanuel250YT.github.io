# Build + checks on every pull request; deploy to GitHub Pages on every push to main
# and once a day (the static HTML carries the npm download count of that build).
# Actions are pinned by commit SHA (supply chain); Dependabot keeps them up to date.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: sitemap <lastmod> and JSON-LD dates come from git (astro.config.mjs).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets ignore-scripts=true: no dependency runs install scripts.
      - name: Install dependencies (exact lockfile)
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Static SEO and accessibility checks
        run: node scripts/verify-seo.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
